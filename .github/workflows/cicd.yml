name: Deploy NestJS to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: self-hosted

    env:
      IMAGE_NAME: lahiruyasas/movie-rating-app-cloud

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSOWORD }}

      - name: Extract Git commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_DEPLOY_SSH_PRIVATE_KEY }}

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            APP_NAME=nestjs-app
            IMAGE=${{ env.IMAGE_NAME }}:latest
            CONTAINER_PORT=3001
            HOST_PORT=3001

            echo "Stopping old container..."
            docker stop $APP_NAME || true
            docker rm $APP_NAME || true

            echo "Pulling latest image..."
            docker pull $IMAGE

            echo "Writing .env from GitHub secret..."
            mkdir -p ~/app
            echo "${{ secrets.ENV_FILE }}" | base64 -d > ~/app/.env

            echo "Running new container..."
            docker run -d \
              --name $APP_NAME \
              --env-file ~/app/.env \
              -p $HOST_PORT:$CONTAINER_PORT \
              --restart unless-stopped \
              $IMAGE

            echo "Waiting for app to be healthy..."
            sleep 10
            curl -f http://localhost:$HOST_PORT/health || (echo "Health check failed!" && exit 1)

            echo "✅ Deployment successful"
          EOF
